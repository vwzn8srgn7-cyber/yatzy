  <style>
    #splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(120% 90% at 30% 10%, #4cb87e, #2f9a5c 60%, #1f7a47); transition: opacity .25s; }
    #splash[hidden] { display: none; }
    #splash.out { opacity: 0; pointer-events: none; }
    .sp-die { width: 84px; height: 84px; filter: drop-shadow(0 6px 6px rgba(0,0,0,.25)); }
    .sp-word { display: flex; }
    .sp-word span { font: 900 54px/1 ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Avenir Next", system-ui, sans-serif; color: #fff; display: inline-block; letter-spacing: -1px;
      transform: rotate(var(--rot)); text-shadow: 0 3px 0 var(--lc), 0 6px 0 rgba(0,0,0,.18), 0 10px 14px rgba(0,0,0,.2); }
    .sp-bar { width: 170px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.28); overflow: hidden; }
    .sp-bar i { display: block; height: 100%; width: 42%; border-radius: 3px; background: #c8f04a; animation: spbar 1.1s ease-in-out infinite; }
    @keyframes spbar { from { transform: translateX(-110%); } to { transform: translateX(250%); } }
  </style>
</head>
