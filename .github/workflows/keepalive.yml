# Hält die kostenlose Supabase-Datenbank wach (sie wird sonst nach ca. einer Woche ohne Nutzung pausiert).
# Läuft zweimal pro Woche und liest einen Eintrag der Rangliste. Der Schlüssel ist der öffentliche "anon"-Schlüssel aus config.js.
name: Datenbank wach halten
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anpingen
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "https://xykqdpziesuiejekwpih.supabase.co/rest/v1/yatzy_leaderboard?select=name&limit=1")
          echo "Antwort: $code"
          test "$code" = "200"
        env:
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5a3FkcHppZXN1aWVqZWt3cGloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxODk3NjQsImV4cCI6MjEwOTc2NTc2NH0.pNJPsTx7Cugj8II6KXpn3KgBNITmOHEHlSqUDxvaXRQ
